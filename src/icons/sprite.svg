<!--
	rahkar-ui — اسپرایت آیکون

	قواعد ست: شبکهٔ ۲۴×۲۴، ضخامت خط ۱٫۷۵ (عمداً نازک نیست)، سرِ خط مربعی و
	اتصال گوشه‌ای — نه گرد. رنگ از `currentColor` می‌آید، پس با color والد
	عوض می‌شود.

	هر آیکون باید ویژگی‌های ظاهری را روی خودِ <symbol> داشته باشد؛ هنگام
	ارجاع بیرونی با <use>، ویژگی‌های <svg> ریشه به کپی منتقل نمی‌شوند.
-->
